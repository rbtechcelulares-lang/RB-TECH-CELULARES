<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Admin · RB Tech Celulares</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#14110f">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=20261021p">
  <link rel="stylesheet" href="assets/css/admin.css?v=20261021p">
  <link rel="icon" type="image/png" sizes="64x64" href="img/marca/favicon-64.png">
  <link rel="icon" type="image/png" sizes="32x32" href="img/marca/favicon-32.png">
  <link rel="apple-touch-icon" href="img/marca/apple-touch-icon.png">
</head>
<body class="admin">

  <section id="login" class="login">
    <form class="login-box" id="login-form">
      <img class="login-logo" src="img/marca/logo-marca.webp" alt="RB Tech Celulares">
      <h1>Painel da loja</h1>
      <p class="muted">Digite a senha do administrador.</p>
      <label class="field"><span>Senha</span><input type="password" id="senha" autocomplete="current-password" required></label>
      <p class="err" id="login-err" hidden>Senha incorreta.</p>
      <button class="btn btn-ink btn-block" type="submit">Entrar</button>
      <a href="index.html" class="back">← Voltar para o site</a>
    </form>
  </section>

  <div id="app" hidden>
    <header class="a-top">
      <div class="a-top-in">
        <a class="brand" href="index.html" target="_blank"><img class="a-logo" src="img/marca/logo-marca.webp" alt="RB Tech"><span class="brand-name">Admin</span></a>
        <nav class="a-tabs" id="tabs">
          <button data-tab="produtos" class="on">iPhones</button>
          <button data-tab="promocoes">Promoções</button>
          <button data-tab="cliques">Cliques</button>
          <button data-tab="avaliacao">Avaliação de entrada</button>
          <button data-tab="pagamento">Parcelas e taxas</button>
          <button data-tab="loja">Loja e contatos</button>
          <button data-tab="textos">Textos do site</button>
          <button data-tab="publicar">Publicar</button>
        </nav>
      </div>
    </header>

    <div class="draft-bar" id="draft-bar" hidden>
      <span><strong>Alterações não publicadas.</strong> Elas só aparecem para os clientes depois de publicar.</span>
      <span class="draft-actions">
        <a class="btn btn-sm btn-outline" href="index.html?preview=1" target="_blank">Pré-visualizar</a>
        <button class="btn btn-sm btn-gold" data-goto="publicar">Publicar agora</button>
      </span>
    </div>

    <main class="a-main">
      <section data-panel="produtos"></section>
      <section data-panel="promocoes" hidden></section>
      <section data-panel="cliques" hidden></section>
      <section data-panel="avaliacao" hidden></section>
      <section data-panel="pagamento" hidden></section>
      <section data-panel="loja" hidden></section>
      <section data-panel="textos" hidden></section>
      <section data-panel="publicar" hidden></section>
    </main>
  </div>

  <!-- Editor de produto -->
  <div class="sheet" id="editor" hidden>
    <div class="sheet-backdrop"></div>
    <div class="sheet-panel editor-panel" role="dialog" aria-modal="true">
      <form id="ed-form"></form>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="assets/js/core.js?v=20261021p"></script>
  <script src="assets/js/admin.js?v=20261021p"></script>
</body>
</html>
